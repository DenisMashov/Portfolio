<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "League Spartan", sans-serif;
    background-color: #1a1a1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.message-page {
    display: none;
    max-width: 600px;
    padding: 40px 30px;
    text-align: center;
    animation: fadeIn 1.2s ease;
}
.message-page p {
    font-size: 1.1rem;
    color: #ccc;
    line-height: 1.9;
    font-weight: 300;
    white-space: pre-line;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}
.overlay {
    position: fixed;
    inset: 0;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    background: rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    transition: opacity 0.6s ease;
}
.overlay.hidden { opacity: 0; pointer-events: none; }
.overlay p { font-size: 0.95rem; color: #888; margin-bottom: 4px; }
.overlay input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 12px 24px;
    font-size: 1.1rem;
    color: #fff;
    text-align: center;
    outline: none;
    font-family: "League Spartan", sans-serif;
    letter-spacing: 6px;
    width: 180px;
    transition: border-color 0.2s ease, background 0.2s ease;
}
.overlay input:focus { border-color: rgba(255,255,255,0.25); }
.overlay input.wrong {
    border-color: rgba(255, 60, 60, 0.8);
    background: rgba(255, 60, 60, 0.08);
    animation: shake 0.35s ease;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-8px); }
    60%       { transform: translateX(8px); }
    80%       { transform: translateX(-4px); }
}
</style>

async function getKey(val) {
    const salted = s + val + e;
    const enc = new TextEncoder().encode(salted);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return new Uint8Array(buf);
}

async function check(val) {
    const key = await getKey(val);
    const hex = Array.from(key).map(b => b.toString(16).padStart(2,"0")).join("");

}

function decrypt(cipherB64, key) {
    const bytes = Uint8Array.from(atob(cipherB64), c => c.charCodeAt(0));
    const dec = bytes.map((b, i) => b ^ key[i % key.length]);
    return new TextDecoder().decode(dec);
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "League Spartan", sans-serif;
    background-color: #1a1a1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.message-page {
    display: none;
    max-width: 600px;
    padding: 40px 30px;
    text-align: center;
    animation: fadeIn 1.2s ease;
}
.message-page p {
    font-size: 1.1rem;
    color: #ccc;
    line-height: 1.9;
    font-weight: 300;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}
.overlay {
    position: fixed;
    inset: 0;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    background: rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    transition: opacity 0.6s ease;
}
.overlay.hidden { opacity: 0; pointer-events: none; }
.overlay p { font-size: 0.95rem; color: #888; margin-bottom: 4px; }
.overlay input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 12px 24px;
    font-size: 1.1rem;
    color: #fff;
    text-align: center;
    outline: none;
    font-family: "League Spartan", sans-serif;
    letter-spacing: 6px;
    width: 180px;
    transition: border-color 0.2s ease, background 0.2s ease;
}
.overlay input:focus { border-color: rgba(255,255,255,0.25); }
.overlay input.wrong {
    border-color: rgba(255, 60, 60, 0.8);
    background: rgba(255, 60, 60, 0.08);
    animation: shake 0.35s ease;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-8px); }
    60%       { transform: translateX(8px); }
    80%       { transform: translateX(-4px); }
}
</style>
</head>
<body>

<div class="message-page" id="message">
    <p id="msg-text"></p>
</div>

<div class="overlay" id="overlay">
    <p>parolayi zaten biliyon 🌹</p>
    <input type="password" id="passwordInput" autofocus>
</div>

<script>
const h = "6067d0559180cef598b147ea7a4ce0f13a74688e0d04994adbe74e6a937e20a3";

document.getElementById("message").style.display = "block";

const input = document.getElementById("passwordInput");

async function check(val) {
    const salted = s + val + e;
    const enc = new TextEncoder().encode(salted);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
    return hex === h;
}

input.addEventListener("keydown", async (ev) => {
    if (ev.key === "Enter") {
        const ok = await check(input.value);
        if (ok) {
            document.getElementById("msg-text").textContent = atob(encoded);
            const overlay = document.getElementById("overlay");
            overlay.classList.add("hidden");
            setTimeout(() => overlay.remove(), 700);
        } else {
            input.classList.add("wrong");
            input.value = "";
            setTimeout(() => input.classList.remove("wrong"), 500);
        }
    }
});
</script>

</body>
</html>
